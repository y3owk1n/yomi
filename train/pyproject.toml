[project]
name = "yomi-train"
version = "0"
description = "Renders synthetic lines, trains yomi's recognizers and exports them for the Go engine"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
    "pillow>=11.3",
    "fonttools>=4.59",
    "wordfreq>=3.1",
    "opencc>=1.1",
    "uharfbuzz>=0.57",
    "freetype-py>=2.5",
    "playwright>=1.65.2",
]

[tool.uv]
package = false

[dependency-groups]
teacher = [
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "python-bidi>=0.6.12",
    "rapidocr==3.10.0",
]
