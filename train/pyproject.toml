[project]
name = "yomi-train"
version = "0"
description = "Renders synthetic lines, trains yomi's recognizers and exports them for the Go engine"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
    "pillow>=11.3",
    "fonttools>=4.59",
    "wordfreq>=3.1",
    "opencc>=1.1",
    "uharfbuzz>=0.57",
    "freetype-py>=2.5",
]

[tool.uv]
package = false
