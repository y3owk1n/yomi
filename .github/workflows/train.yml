name: train

# Fine-tunes a recognizer on GitHub's CPU runners and uploads the exported
# model. The starting checkpoints and data/wiki come from the
# training-checkpoints pre-release. Run it by hand:
#   gh workflow run train -f family=western -f init=western-b.pt -f args="--width 0.8"
on:
  workflow_dispatch:
    inputs:
      family:
        description: model family in train/families.py
        required: true
      init:
        description: checkpoint in the training-checkpoints release
        required: true
      count:
        description: training lines to render
        default: "60000"
      steps:
        description: training steps
        default: "3000"
      args:
        description: more train.py arguments, such as --width 0.8
        default: ""

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      FAMILY: ${{ inputs.family }}
      INIT: ${{ inputs.init }}
      COUNT: ${{ inputs.count }}
      STEPS: ${{ inputs.steps }}
      ARGS: ${{ inputs.args }}
    defaults:
      run:
        working-directory: train
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv --python 3.12 .venv
          uv pip install --python .venv --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --python .venv numpy pillow fonttools wordfreq opencc uharfbuzz freetype-py
      - name: Fetch fonts and the starting checkpoint
        run: |
          sh fetch_fonts.sh > /dev/null
          gh release download training-checkpoints -p "$INIT" -p wiki.tar -D ckpt
          mkdir -p data && tar -xf ckpt/wiki.tar -C data
      - name: Render training lines
        run: .venv/bin/python prerender.py "$FAMILY" data/job "$COUNT" 41
      - name: Train
        run: |
          .venv/bin/python train.py runs/job --family "$FAMILY" --data data/job \
            --init "ckpt/$INIT" --steps "$STEPS" --device cpu $ARGS
      - name: Export
        run: |
          .venv/bin/python export.py runs/job/best.pt out/model
          cp runs/job/log.jsonl out/
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: train/out
