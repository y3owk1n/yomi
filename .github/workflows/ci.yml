name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Times the fixture reads on the x86 runners, ubuntu-latest and
  # windows-latest, beside arm64. The other timings in docs/benchmarks.md
  # come from Apple Silicon.
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: bench
        shell: bash
        run: go test -run '^$' -bench . -count 5 . | tee bench-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: bench-${{ matrix.os }}.txt
